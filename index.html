<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>setup</title>
  <meta name="description" content="Install resume, ai-menu, kernel-simmer, backup, monitoring, and more with one command.">
  <meta property="og:title" content="setup">
  <meta property="og:description" content="Install resume, ai-menu, kernel-simmer, backup, monitoring, and more with one command.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --fg: #f1f1ee;
      --muted: #777772;
      --line: #2b2b28;
      --panel: #10100f;
      --hot: #c8ff3d;
      --mono: "SF Mono", "JetBrains Mono", "IBM Plex Mono", Consolas, monospace;
      --sans: "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
      padding: 24px;
      color: var(--fg);
      background: var(--bg);
      font-family: var(--sans);
    }

    /* Scrim: keeps the bottom chrome legible over arbitrary video frames. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 1;
      background: linear-gradient(to bottom, rgba(5, 5, 5, 0) 42%, rgba(5, 5, 5, 0.55) 74%, rgba(5, 5, 5, 0.92));
      pointer-events: none;
    }

    .motion-background {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 2;
      width: min(760px, 100%);
    }

    .command {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 84px;
      align-items: stretch;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    code {
      display: block;
      overflow-x: auto;
      padding: 22px 24px;
      text-align: left;
      color: var(--fg);
      font-family: var(--mono);
      font-size: clamp(13px, 2.6vw, 18px);
      line-height: 1.35;
      white-space: nowrap;
    }

    #copy-button {
      border: 0;
      border-left: 1px solid var(--line);
      color: var(--bg);
      background: var(--hot);
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      transition: filter 150ms ease, opacity 180ms ease;
    }

    #copy-button.is-fading { opacity: 0; }

    #copy-button:active { filter: brightness(0.8); }
    #copy-button:focus-visible { outline: 2px solid var(--fg); outline-offset: -5px; }

    footer {
      position: relative;
      z-index: 2;
      text-align: center;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    footer a {
      color: inherit;
      text-decoration: none;
    }

    footer a:hover { color: var(--fg); }

    @media (max-width: 560px) {
      .command { grid-template-columns: 1fr; }
      #copy-button { min-height: 56px; border-left: 0; border-top: 1px solid var(--line); }
      /* Wrap at the spaces rather than truncating; copy still yields one line. */
      code { white-space: pre-wrap; padding: 18px 16px; line-height: 1.5; }
    }

    @media (prefers-reduced-motion: reduce) {
      .motion-background { display: none; }
      body {
        background: #050505 url('/media/setup-bg-poster.jpg') center / cover fixed no-repeat;
      }
    }
  </style>
</head>
<body>
  <video class="motion-background" autoplay muted loop playsinline preload="metadata" poster="/media/setup-bg-poster.jpg" aria-hidden="true">
    <source src="/media/setup-bg-720p.mp4" type="video/mp4" media="(max-width: 900px)">
    <source src="/media/setup-bg-1080p.mp4" type="video/mp4">
  </video>

  <main>
    <div class="command" role="group" aria-label="Install command">
      <code id="install-command">curl -fsSL https://setup.lost.plus/install.sh | zsh</code>
      <button id="copy-button" type="button" aria-label="Copy install command">copy</button>
    </div>
  </main>

  <footer><a href="https://github.com/LPFchan/setup">github</a></footer>

  <script>
    const button = document.getElementById('copy-button');
    const command = document.getElementById('install-command').textContent;

    function fallbackCopy(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.top = '-1000px';
      document.body.appendChild(textarea);
      textarea.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(textarea);
      return ok;
    }

    button.addEventListener('click', async () => {
      let copied = false;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(command);
          copied = true;
        }
      } catch (_) {
        copied = false;
      }

      if (!copied) copied = fallbackCopy(command);

      button.textContent = copied ? '✓' : 'copy?';
      setTimeout(() => {
        button.classList.add('is-fading');
        setTimeout(() => {
          button.textContent = 'copy';
          button.classList.remove('is-fading');
        }, 180);
      }, 900);
    });
  </script>
</body>
</html>
