<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>setup</title>
  <meta name="description" content="Install resume, ai-menu, kernel-simmer, backup, monitoring, and more with one command.">
  <meta property="og:title" content="setup">
  <meta property="og:description" content="Install resume, ai-menu, kernel-simmer, backup, monitoring, and more with one command.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --fg: #f1f1ee;
      --muted: #777772;
      --hot: #c8ff3d;
      --mono: "SF Mono", "JetBrains Mono", "IBM Plex Mono", Consolas, monospace;
      --sans: "Helvetica Neue", Arial, sans-serif;
      /* Overshoot on the way out, settle on the way back: reads as liquid. */
      --morph-out: cubic-bezier(0.34, 1.32, 0.64, 1);
      --morph-in: cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Written every frame by the drag spring. Registered so the compositor gets
       typed values instead of re-parsing a transform string per tick. */
    @property --tx { syntax: "<length>"; inherits: false; initial-value: 0px; }
    @property --ty { syntax: "<length>"; inherits: false; initial-value: 0px; }
    @property --sx { syntax: "<number>"; inherits: true; initial-value: 1; }
    @property --sy { syntax: "<number>"; inherits: true; initial-value: 1; }
    @property --lift { syntax: "<length>"; inherits: false; initial-value: 0px; }
    /* Inherited so the tint layer above the lens can read it, registered so it
       still interpolates across the morph now that it is not background-color. */
    @property --fill {
      syntax: "<color>";
      inherits: true;
      initial-value: rgba(255, 255, 255, 0.78);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
      padding: 24px;
      color: var(--fg);
      background: var(--bg);
      font-family: var(--sans);
    }

    /* Scrim: keeps the bottom chrome legible over arbitrary video frames.
       Deliberately lighter than a pure legibility scrim would be — at 0.92 the
       backdrop behind the pill was crushed to ~8% luminance and the lens had
       nothing left to bend. The footer buys its contrast back with a shadow. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 1;
      background: linear-gradient(to bottom, rgba(5, 5, 5, 0) 42%, rgba(5, 5, 5, 0.38) 74%, rgba(5, 5, 5, 0.6));
      pointer-events: none;
    }

    .motion-background,
    .motion-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    /* The backdrop and the glass are one canvas and one draw, so they cannot
       drift apart: the video frame is uploaded once and both passes read it.
       The <video> underneath stays displayed — covered, never hidden — because
       Gecko stops delivering frames to a video it believes nobody can see, and
       it also shows through until the first canvas frame lands. */
    .motion-canvas { display: none; }
    .lensing .motion-canvas { display: block; }

    main {
      position: relative;
      z-index: 2;
      width: min(760px, 100%);
    }

    .install {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    #install-button {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 17px 28px;
      min-height: 54px;
      overflow: hidden;
      border: 0;
      border-radius: 999px;
      color: #050505;
      /* Translucent enough to lens, opaque enough to hold black text: 0.78
         white composites to rgb(200) on the bare background — 12.2:1. The
         colour is painted by .glass-tint, which stacks above the lens canvas;
         the button's own background would sit behind it and never be seen. */
      --fill: rgba(255, 255, 255, 0.78);
      background: transparent;
      /* Frost for engines with no canvas 2D: the lens layer stays blank and
         this is the whole glass. Where the lens runs it draws its own frost
         and sits on top of this, so the two never compound. */
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), inset 0 -1px 0 rgba(0, 0, 0, 0.08);
      cursor: pointer;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      /* One declaration owns the transform so the spring, the hover lift and
         the press never clobber each other. Axis-aligned scale only: stretching
         along a rotating axis shears a wide pill into a parallelogram, which is
         what made dragging a full circle feel like it was skewing. */
      transform:
        translate(var(--tx), calc(var(--ty) + var(--lift)))
        scale(var(--sx), var(--sy));
    }

    /* The tint that makes the glass read as glass, over the refracted backdrop.
       The refraction itself is no longer a layer inside the button: it is
       painted into the backdrop canvas at the pill's own rect, underneath
       everything here. */
    .glass-tint {
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: inherit;
      background: var(--fill);
      pointer-events: none;
    }

    /* With the lens painting its own frosted backdrop, the CSS frost would only
       double up, and the white fill needs to carry the label and nothing else. */
    #install-button.has-lens {
      --fill: rgba(255, 255, 255, 0.72);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    #install-button.is-ready {
      width: var(--w-idle);
      height: var(--h-idle);
      transition:
        width 540ms var(--morph-in),
        height 540ms var(--morph-in),
        color 260ms linear,
        --fill 380ms var(--morph-in),
        box-shadow 380ms var(--morph-in),
        --lift 200ms ease;
    }

    #install-button.is-ready.is-open {
      width: var(--w-open);
      height: var(--h-open);
      color: var(--fg);
      /* Nearly clear once open, so the refraction is the dominant read. */
      --fill: rgba(255, 255, 255, 0.07);
      box-shadow: 0 22px 48px rgba(0, 0, 0, 0.5), inset 0 -1px 0 rgba(255, 255, 255, 0.07);
      transition:
        width 620ms var(--morph-out),
        height 620ms var(--morph-out),
        color 260ms linear,
        --fill 340ms var(--morph-in),
        box-shadow 340ms var(--morph-in),
        --lift 200ms ease;
    }

    #install-button.has-lens.is-ready.is-open { --fill: rgba(255, 255, 255, 0.04); }

    #install-button:hover { --lift: -1px; }
    #install-button:focus-visible { outline: 2px solid var(--hot); outline-offset: 3px; }

    /* Dragging across the command would otherwise select it mid-fling. */
    #install-button.is-dragging,
    #install-button.is-dragging #install-command {
      user-select: none;
      -webkit-user-select: none;
      cursor: grabbing;
    }

    /* Meniscus: a chromatic fringe over the band where the lens bends hardest,
       so the tint and the refraction land on the same ring. The bending itself
       lives in the displacement map — no backdrop-filter can reach out here,
       because the button's own backdrop-filter would make it a backdrop root. */
    .glass-rim {
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: inherit;
      padding: var(--rim, 13px);
      background: linear-gradient(115deg, rgba(255, 128, 96, 0.22), rgba(255, 255, 255, 0) 34%, rgba(255, 255, 255, 0) 66%, rgba(96, 168, 255, 0.26));
      /* Ring = border-box minus content-box, so the band is the padding. */
      -webkit-mask-image: linear-gradient(#000 0 0), linear-gradient(#000 0 0);
      -webkit-mask-clip: content-box, border-box;
      -webkit-mask-composite: xor;
      mask-image: linear-gradient(#000 0 0), linear-gradient(#000 0 0);
      mask-clip: content-box, border-box;
      mask-composite: exclude;
      /* Present but restrained while idle; full strength once open. */
      opacity: 0.45;
      pointer-events: none;
      transition: opacity 380ms var(--morph-in);
    }

    /* Rim light — the glass edge. Only present once the pill is open. */
    #install-button::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      border-radius: inherit;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.55),
        inset 0 -1px 1px rgba(255, 255, 255, 0.22),
        inset 0 0 0 1px rgba(255, 255, 255, 0.18),
        inset 0 0 22px rgba(255, 255, 255, 0.09);
      opacity: 0;
      pointer-events: none;
      transition: opacity 380ms var(--morph-in);
    }

    #install-button.is-open::before,
    #install-button.is-open .glass-rim { opacity: 1; }

    /* Specular sweep, replayed on every copy as the confirmation beat. */
    #install-button::after {
      content: "";
      position: absolute;
      inset: -50% -25%;
      z-index: 5;
      background: linear-gradient(105deg, transparent 36%, rgba(255, 255, 255, 0.5) 50%, transparent 64%);
      opacity: 0;
      pointer-events: none;
    }

    #install-button.is-flash::after { animation: sheen 820ms var(--morph-in); }

    @keyframes sheen {
      from { transform: translateX(-130%); opacity: 0; }
      35% { opacity: 0.9; }
      to { transform: translateX(130%); opacity: 0; }
    }

    .face {
      position: relative;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      /* The glass stretches, the label does not: undo the pill's deformation
         so the text stays upright and unsqueezed while the body pulls. */
      transform: scale(calc(1 / var(--sx)), calc(1 / var(--sy)));
      transition: opacity 240ms var(--morph-in), filter 240ms var(--morph-in);
    }

    .face svg {
      flex: none;
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .face--idle {
      font-family: var(--mono);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    /* Both faces leave the flow once measured, so the pill sizes from the vars. */
    .is-ready .face--idle,
    .face--command {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(calc(1 / var(--sx)), calc(1 / var(--sy)));
      width: max-content;
    }

    .face--command {
      opacity: 0;
      filter: blur(4px);
    }

    .is-open .face--idle {
      opacity: 0;
      filter: blur(4px);
    }

    .is-open .face--command {
      opacity: 1;
      filter: none;
      transition-delay: 90ms;
    }

    #install-command {
      min-width: 0;
      font-family: var(--mono);
      font-size: clamp(12px, 2.3vw, 15px);
      line-height: 1.4;
      text-align: left;
      white-space: nowrap;
      user-select: text;
      -webkit-user-select: text;
    }

    .glyph-fail { display: none; }
    [data-state="fail"] .glyph-ok { display: none; }
    [data-state="fail"] .glyph-fail { display: block; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    noscript code {
      display: block;
      padding: 18px 22px;
      border: 1px solid #2b2b28;
      border-radius: 14px;
      background: #10100f;
      font-family: var(--mono);
      font-size: clamp(12px, 2.3vw, 15px);
      overflow-x: auto;
    }

    footer {
      position: relative;
      z-index: 2;
      text-align: center;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    footer a {
      color: inherit;
      text-decoration: none;
    }

    footer a:hover { color: var(--fg); }

    footer { text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85); }

    /* Too narrow for one line: wrap at the spaces, the pill grows taller. */
    @media (max-width: 560px) {
      #install-button { padding: 16px 22px; --rim: 10px; }
      #install-command { white-space: pre-wrap; }
    }

    @media (prefers-reduced-motion: reduce) {
      /* The canvas stays: it draws the poster and the lens still refracts it.
         The body background below is what shows if there is no WebGL2. */
      .motion-background { display: none; }
      body {
        background: #050505 url('/media/setup-bg-poster.jpg') center / cover fixed no-repeat;
      }
      #install-button,
      #install-button.is-ready,
      #install-button.is-ready.is-open,
      #install-button::before,
      .glass-rim,
      .face { transition: none; }
      #install-button.is-flash::after { animation: none; }
      /* The lens still refracts; it just stops chasing the pointer. */
      #install-button:hover { --lift: 0px; }
    }
  </style>
</head>
<body>
  <video class="motion-background" autoplay muted loop playsinline preload="metadata" poster="/media/setup-bg-poster.jpg" aria-hidden="true">
    <source src="/media/setup-bg-720p.mp4" type="video/mp4" media="(max-width: 900px)">
    <source src="/media/setup-bg-1080p.mp4" type="video/mp4">
  </video>
  <canvas class="motion-canvas" aria-hidden="true"></canvas>

  <main>
    <div class="install">
      <button id="install-button" type="button" aria-label="Copy the install command">
        <span class="glass-tint" aria-hidden="true"></span>
        <span class="glass-rim" aria-hidden="true"></span>
        <span class="face face--idle">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12"></path>
            <path d="M7 11l5 5 5-5"></path>
            <path d="M4 20h16"></path>
          </svg>
          <span>install</span>
        </span>
        <span class="face face--command">
          <code id="install-command">curl -fsSL https://setup.lost.plus/install.sh | zsh</code>
          <svg class="glyph-ok" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="8" y="2" width="8" height="4" rx="1"></rect>
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
            <path d="m9 14 2 2 4-4"></path>
          </svg>
          <svg class="glyph-fail" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="8" y="2" width="8" height="4" rx="1"></rect>
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
            <path d="M12 11v3"></path>
            <path d="M12 17.5h.01"></path>
          </svg>
        </span>
      </button>
    </div>
    <noscript><code>curl -fsSL https://setup.lost.plus/install.sh | zsh</code></noscript>
    <p id="install-status" class="sr-only" role="status" aria-live="polite"></p>
  </main>

  <footer><a href="https://github.com/LPFchan/setup">github</a></footer>

  <script>
    (() => {
      const button = document.getElementById('install-button');
      const idleFace = button.querySelector('.face--idle');
      const commandFace = button.querySelector('.face--command');
      const status = document.getElementById('install-status');
      const command = document.getElementById('install-command').textContent.trim();
      const MIN_HEIGHT = 54;
      const HOLD_MS = 3200;
      let collapseTimer = 0, holdFor = HOLD_MS, hovering = false, viaKeyboard = false;

      // The faces are out of flow, so the pill has no intrinsic size — derive
      // both its states from the faces' natural boxes and hand them to CSS.
      function measure() {
        const styles = getComputedStyle(button);
        const padX = parseFloat(styles.paddingLeft) + parseFloat(styles.paddingRight);
        const padY = parseFloat(styles.paddingTop) + parseFloat(styles.paddingBottom);
        const available = button.parentElement.clientWidth;

        commandFace.style.maxWidth = Math.max(0, available - padX) + 'px';

        const idle = idleFace.getBoundingClientRect();
        const open = commandFace.getBoundingClientRect();
        const set = (name, value) => button.style.setProperty(name, Math.ceil(value) + 'px');

        set('--w-idle', idle.width + padX);
        set('--w-open', Math.min(open.width + padX, available));
        set('--h-idle', Math.max(MIN_HEIGHT, idle.height + padY));
        set('--h-open', Math.max(MIN_HEIGHT, open.height + padY));
      }

      function fallbackCopy(text) {
        // select() moves focus to the textarea, so remember where it was.
        const previous = document.activeElement;
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.top = '-1000px';
        document.body.appendChild(textarea);
        textarea.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(textarea);
        // Without this a keyboard user is dumped at the top of the document
        // every time they copy, on any engine that needs this path.
        if (previous && previous.focus) previous.focus();
        return ok;
      }

      async function copy(text) {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch (_) {
          /* fall through to the textarea path */
        }
        return fallbackCopy(text);
      }

      function collapse() {
        clearTimeout(collapseTimer);
        button.classList.remove('is-open', 'is-flash');
        invalidate();
        delete button.dataset.state;
        status.textContent = '';
        viaKeyboard = false;
      }

      // Collapsing under a pointer that is still on the command — or mid-drag,
      // or on a keyboard user who tabbed to it — yanks it away while it is
      // being read. Hold while engaged and re-arm on the way out.
      // :focus-visible is not dependable here — engines disagree on whether it
      // survives the Enter that opened the pill — so keyboard use is tracked
      // outright. A mouse click also leaves the button focused, which is why
      // this turns on only when no pointer drove the activation.
      function engaged() {
        return hovering || dragging ||
          (viaKeyboard && document.activeElement === button);
      }

      function armCollapse(ms) {
        if (ms !== undefined) holdFor = ms;
        clearTimeout(collapseTimer);
        collapseTimer = setTimeout(() => {
          if (engaged()) return;    // pointerleave / blur will re-arm it
          collapse();
        }, holdFor);
      }

      button.addEventListener('pointerenter', () => { hovering = true; });
      button.addEventListener('pointerleave', () => {
        hovering = false;
        if (button.classList.contains('is-open')) armCollapse();
      });
      button.addEventListener('blur', () => {
        if (button.classList.contains('is-open')) armCollapse();
      });

      button.addEventListener('click', async () => {
        // A fling is not a click. Capture-phase listeners are not reliably
        // ordered ahead of this one on the same element, so the drag gate
        // lives here rather than in a separate suppressor.
        // Read before wasDragged() clears it: no pointer sequence means the
        // Enter or Space of a keyboard user.
        viaKeyboard = pressedAt === 0;
        if (wasDragged()) return;

        const copied = await copy(command);

        measure();
        button.dataset.state = copied ? 'copied' : 'fail';
        button.classList.add('is-open');
        invalidate();

        // Restart the sweep so a repeat click still confirms visibly.
        button.classList.remove('is-flash');
        void button.offsetWidth;
        button.classList.add('is-flash');

        status.textContent = copied
          ? 'Copied to clipboard: ' + command
          : 'Copy failed. Select the command to copy it manually.';

        // Leave a failed copy up long enough to select the command by hand.
        armCollapse(copied ? HOLD_MS : HOLD_MS * 2);
      });

      button.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && button.classList.contains('is-open')) collapse();
      });

      button.classList.add('is-ready');
      measure();

      if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
      if (window.ResizeObserver) new ResizeObserver(measure).observe(button.parentElement);
      else window.addEventListener('resize', measure);

      // ---------------------------------------------------------------------
      // Lens. Not an SVG filter: no filter graph survives both engines, since
      // Chromium ignores feImage's x/y/width/height and stretches the map over
      // the whole filter region while WebKit drops backdrop-filter: url()
      // outright. So the optics run in a fragment shader over a copy of the
      // backdrop, which also puts dispersion, Fresnel and the specular within
      // reach and costs no readback.
      // ---------------------------------------------------------------------
      const stage = document.querySelector('.motion-canvas');
      const video = document.querySelector('.motion-background');
      const BLEED = 26;      // px of backdrop kept outside the pill to bend inward
      const THICK = 17;      // width of the refracting rim band
      const DISP = 21;       // peak displacement
      const IOR = 1.5;
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');

      // Convex squircle y = (1-(1-x)^4)^(1/4) — Apple's profile rather than a
      // circle: the shoulder is softer, so the rim doesn't band.
      const surface = (x) => Math.pow(1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 4), 0.25);

      // Snell keeps the bend finite where the slope runs away at the very edge.
      function bend(t) {
        const e = 1e-4;
        const slope = (surface(t + e) - surface(t - e)) / (2 * e);
        const incidence = Math.atan(slope);
        const exit = Math.asin(Math.min(Math.sin(incidence) / IOR, 1));
        return Math.tan(incidence - exit);
      }

      let peakBend = 0;
      for (let i = 0; i <= 256; i++) peakBend = Math.max(peakBend, bend(i / 256));

      // Set once the lens has proved it cannot hold a frame rate, which in
      // practice means software GL — a blocklisted GPU, a VM, or acceleration
      // switched off. Everything reverts to the plain video and the CSS frost.
      let lensOff = false;

      function disableLens() {
        lensOff = true;
        button.classList.remove('has-lens');
        document.body.classList.remove('lensing');
      }

      const poster = new Image();
      let posterReady = false;
      poster.onload = () => { posterReady = true; };
      poster.src = '/media/setup-bg-poster.jpg';

      // --- GL -------------------------------------------------------------
      // One canvas, one context, one upload. The video frame lands in a texture
      // once per frame and three passes read it: the backdrop over the whole
      // viewport, a crop of the pill's rect into a mipmapped buffer (the frost
      // ladder, one generateMipmap), and the optics back over the pill.
      //
      // The shape of this is forced by the upload. Getting video pixels onto
      // the GPU is the dominant cost and only the direct path is fast in every
      // engine: texImage2D of the <video> costs ~1.3ms in WebKit against ~7.8ms
      // for texSubImage2D of a 2D canvas holding the same pixels. Cropping on
      // the CPU first therefore cost WebKit over half a core. Anything that
      // touches the frame twice — a 2D backdrop canvas plus a lens upload, or
      // two GL contexts, which cannot share a texture — pays that toll twice.
      const VERT = `#version 300 es
        in vec2 a;
        void main() { gl_Position = vec4(a, 0.0, 1.0); }`;

      // object-fit: cover, as a uv window onto the frame.
      const COVER = `
        uniform vec2 uUvScale, uUvOff;
        vec2 cover(vec2 uv) { return uv * uUvScale + uUvOff; }`;

      // Pass 1. Straight from the video texture, no scrim: body::before still
      // paints that over the canvas exactly as it did over the <video>.
      const FRAG_BG = `#version 300 es
        precision highp float;
        uniform sampler2D uSrc;
        uniform vec2 uCanvas;
        out vec4 o;
        ${COVER}
        void main() {
          vec2 p = vec2(gl_FragCoord.x, uCanvas.y - gl_FragCoord.y);
          o = vec4(texture(uSrc, cover(p / uCanvas)).rgb, 1.0);
        }`;

      // Pass 2. The lens samples the frame before the scrim reaches it, so the
      // scrim has to be baked in here or the glass would read brighter than
      // everything around it.
      const FRAG_CROP = `#version 300 es
        precision highp float;
        uniform sampler2D uSrc;
        uniform vec2 uCanvas, uOrigin;
        uniform float uDpr, uVH;
        out vec4 o;
        ${COVER}
        // The same three stops body::before paints.
        float scrim(float v) {
          if (v <= 0.42) return 0.0;
          if (v <= 0.74) return 0.38 * (v - 0.42) / 0.32;
          return 0.38 + 0.22 * (v - 0.74) / 0.26;
        }
        void main() {
          vec2 p = vec2(gl_FragCoord.x, uCanvas.y - gl_FragCoord.y);
          o = vec4(mix(texture(uSrc, cover(p / uCanvas)).rgb, vec3(0.0196),
                       clamp(scrim((uOrigin.y + p.y / uDpr) / uVH), 0.0, 1.0)), 1.0);
        }`;

      const FRAG_LENS = `#version 300 es
        precision highp float;
        uniform sampler2D uTex;
        uniform vec2 uCanvas, uHalf, uLight, uOffset, uScale;
        uniform float uRadius, uThick, uDisp, uIOR, uPeak, uLod, uSpec, uFres, uFade;
        out vec4 o;

        float sdPill(vec2 p, vec2 b, float r) {
          vec2 q = abs(p) - (b - r);
          return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
        }
        // Convex squircle: Apple's profile, softer in the shoulder than a circle.
        float surf(float x) {
          x = clamp(x, 0.0, 1.0);
          return pow(1.0 - pow(1.0 - x, 4.0), 0.25);
        }

        void main() {
          vec2 p = gl_FragCoord.xy - uOffset;     // the lens rect's own axes
          // Undo the mochi stretch: the optics are solved on the pill's
          // undeformed shape and pushed back out through uScale, which is what
          // scaling the whole lens layer in CSS used to do for free. Solving in
          // the deformed frame instead would thin the rim on the pulled axis.
          vec2 c = (p - uCanvas * 0.5) / uScale;
          float sd = sdPill(c, uHalf, uRadius);
          // Pass 1 already put the backdrop here, so outside the pill there is
          // nothing to add; the last pixel of it feathers the edge, since with
          // no CSS layer left to clip there is no border-radius doing it.
          if (sd > 1.0) discard;

          float t = clamp(-sd / uThick, 0.0, 1.0);
          float e = 1e-3;
          float slope = (surf(t + e) - surf(t - e)) / (2.0 * e);
          // Snell, which bounds the bend where the slope runs away at the rim.
          float th1 = atan(slope);
          float th2 = asin(min(sin(th1) / uIOR, 1.0));
          float m = tan(th1 - th2) / uPeak;

          vec2 n = normalize(vec2(
            sdPill(c + vec2(1.0, 0.0), uHalf, uRadius) - sdPill(c - vec2(1.0, 0.0), uHalf, uRadius),
            sdPill(c + vec2(0.0, 1.0), uHalf, uRadius) - sdPill(c - vec2(0.0, 1.0), uHalf, uRadius)
          ) + 1e-6);
          vec2 off = n * m * uDisp * uScale;      // local displacement, back out

          // Red bends furthest, blue least: dispersion fringes the rim.
          vec3 col;
          col.r = textureLod(uTex, (p + off * 1.00) / uCanvas, uLod).r;
          col.g = textureLod(uTex, (p + off * 0.94) / uCanvas, uLod).g;
          col.b = textureLod(uTex, (p + off * 0.88) / uCanvas, uLod).b;

          // Schlick: glass turns mirror at grazing angles, which is most of why
          // a real rim reads as glass rather than as a blurred cutout.
          col += uFres * (0.04 + 0.96 * pow(1.0 - cos(th1), 5.0));

          // Blinn-Phong off the 2D normal lifted into 3D. uLight swings with the
          // drag, so the highlight slides across the rim as the pill is pulled.
          vec3 N = normalize(vec3(n * min(slope, 3.0) * 0.45, 1.0));
          vec3 H = normalize(vec3(uLight, 1.0) + vec3(0.0, 0.0, 1.0));
          col += uSpec * pow(max(dot(N, H), 0.0), 40.0);

          o = vec4(col, uFade * clamp(0.5 - sd, 0.0, 1.0));
        }`;

      let gl = null, bgProg = null, cropProg = null, lensProg = null;
      let bgU = null, cropU = null, lensU = null;
      let srcTex = null, fboTex = null, fbo = null, fboW = 0, fboH = 0;
      let stageW = 0, stageH = 0;
      // 'video' or 'poster' — which one is in srcTex, and whether it is worth
      // re-uploading. The poster never changes, so it goes up once.
      let srcKind = null, srcW = 0, srcH = 0;

      function shader(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src.replace(/^\s+/gm, ''));
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) return null;
        return s;
      }

      function program(fragSrc, names) {
        const vs = shader(gl.VERTEX_SHADER, VERT);
        const fs = shader(gl.FRAGMENT_SHADER, fragSrc);
        if (!vs || !fs) return null;
        const p = gl.createProgram();
        gl.attachShader(p, vs); gl.attachShader(p, fs);
        gl.bindAttribLocation(p, 0, 'a');
        gl.linkProgram(p);
        if (!gl.getProgramParameter(p, gl.LINK_STATUS)) return null;
        const u = {};
        for (const n of names) u[n] = gl.getUniformLocation(p, n);
        return { p, u };
      }

      function makeTexture(mips) {
        const t = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, t);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER,
          mips ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
        return t;
      }

      function initGL() {
        // alpha:false — this canvas is the backdrop now, not an overlay.
        gl = stage.getContext('webgl2', {
          alpha: false, antialias: false, depth: false, stencil: false,
          premultipliedAlpha: true, powerPreference: 'high-performance',
        });
        if (!gl) return false;

        bgProg = program(FRAG_BG, ['uSrc', 'uCanvas', 'uUvScale', 'uUvOff']);
        cropProg = program(FRAG_CROP,
          ['uSrc', 'uCanvas', 'uUvScale', 'uUvOff', 'uOrigin', 'uDpr', 'uVH']);
        lensProg = program(FRAG_LENS,
          ['uTex', 'uCanvas', 'uHalf', 'uLight', 'uOffset', 'uScale', 'uRadius',
           'uThick', 'uDisp', 'uIOR', 'uPeak', 'uLod', 'uSpec', 'uFres', 'uFade']);
        if (!bgProg || !cropProg || !lensProg) { gl = null; return false; }
        bgU = bgProg.u; cropU = cropProg.u; lensU = lensProg.u;

        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER,
          new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

        // Left unflipped on purpose: the shaders address the frame in top-down
        // viewport coordinates, so v=0 has to be the image's top row. Flipping
        // here samples the pill's mirror image instead.
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
        // The lens feathers its own edge against the backdrop underneath.
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        srcTex = makeTexture(false);
        srcKind = null;
        fboTex = makeTexture(true);
        fbo = gl.createFramebuffer();
        stageW = stageH = 0; fboW = fboH = 0;

        stage.addEventListener('webglcontextlost', (e) => {
          e.preventDefault();
          gl = null;
          // The canvas is the backdrop, so it has to get out of the way and let
          // the <video> underneath show again — not just drop the glass.
          button.classList.remove('has-lens');
          document.body.classList.remove('lensing');
        });
        stage.addEventListener('webglcontextrestored', () => {
          if (initGL()) enableLens();
        });
        return true;
      }

      function sizeFBO(W, H) {
        if (fboW === W && fboH === H) return;
        fboW = W; fboH = H;
        gl.bindTexture(gl.TEXTURE_2D, fboTex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fboTex, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      }

      // The one place a video frame is touched. Everything downstream reads the
      // texture, so the backdrop and the glass are the same frame by
      // construction rather than by keeping two clocks in step.
      function upload() {
        const live = !reduced.matches && video && video.readyState >= 2 && video.videoWidth;
        const source = live ? video : (posterReady ? poster : null);
        if (!source) return false;
        const kind = live ? 'video' : 'poster';
        // The poster is a still: once it is up, leave it there.
        if (kind === 'poster' && srcKind === 'poster') return true;
        try {
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, srcTex);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
        } catch (_) {
          return srcKind !== null;            // cross-origin frame; keep the last
        }
        srcKind = kind;
        srcW = live ? video.videoWidth : poster.naturalWidth;
        srcH = live ? video.videoHeight : poster.naturalHeight;
        return true;
      }

      // Fade the glass in rather than popping it, which is what the lens
      // layer's CSS opacity transition used to do.
      let fade = 0, fadeAt = 0;
      const FADE_MS = 240;

      // Backdrop, crop, optics — in that order, over the whole canvas every
      // time. Redrawing the backdrop is what erases the pill's previous
      // footprint, and a single textured quad is far cheaper on the GPU than
      // tracking damage rects on the CPU.
      function drawStage(tx, ty, now) {
        if (!gl || !srcKind || !srcW) return false;

        const VW = window.innerWidth, VH = window.innerHeight;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const CW = Math.round(VW * dpr), CH = Math.round(VH * dpr);
        if (stageW !== CW || stageH !== CH) {
          stage.width = CW; stage.height = CH;
          stageW = CW; stageH = CH;
        }

        // object-fit: cover as a uv window, shared by both sampling passes.
        const cover = Math.max(VW / srcW, VH / srcH);
        const cw = (VW / cover) / srcW, ch = (VH / cover) / srcH;

        // Pass 1: the backdrop, over the whole viewport.
        gl.disable(gl.BLEND);
        gl.disable(gl.SCISSOR_TEST);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, CW, CH);
        gl.useProgram(bgProg.p);
        gl.uniform1i(bgU.uSrc, 0);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, srcTex);
        gl.uniform2f(bgU.uCanvas, CW, CH);
        gl.uniform2f(bgU.uUvScale, cw, ch);
        gl.uniform2f(bgU.uUvOff, (1 - cw) / 2, (1 - ch) / 2);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        // Where the pill actually is, transform and all — the spring, the hover
        // lift and the morph are already folded into the rendered box.
        const r = button.getBoundingClientRect();
        if (!r.width || !r.height) return true;   // backdrop stands on its own
        // Undeformed extents, which is what the optics are solved on.
        const lw = r.width / scaleX, lh = r.height / scaleY;
        const bx = BLEED * scaleX, by = BLEED * scaleY;
        const vx = r.left - bx, vy = r.top - by;
        const w = r.width + bx * 2, h = r.height + by * 2;
        const W = Math.round(w * dpr), H = Math.round(h * dpr);
        sizeFBO(W, H);

        // Pass 2: the same rect of the frame, scrimmed, into the mip pyramid.
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.viewport(0, 0, W, H);
        gl.useProgram(cropProg.p);
        gl.uniform1i(cropU.uSrc, 0);
        gl.uniform2f(cropU.uCanvas, W, H);
        gl.uniform2f(cropU.uUvScale, (w / VW) * cw, (h / VH) * ch);
        gl.uniform2f(cropU.uUvOff,
          (1 - cw) / 2 + (vx / VW) * cw, (1 - ch) / 2 + (vy / VH) * ch);
        gl.uniform2f(cropU.uOrigin, vx, vy);
        gl.uniform1f(cropU.uDpr, dpr);
        gl.uniform1f(cropU.uVH, VH);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        gl.bindTexture(gl.TEXTURE_2D, fboTex);
        gl.generateMipmap(gl.TEXTURE_2D);     // the whole frost ladder, one call

        // Openness drives the frost: thick while the pill is a solid button,
        // nearly clear once it is showing the command through glass.
        const idle = parseFloat(button.style.getPropertyValue('--w-idle')) || lw;
        const open = parseFloat(button.style.getPropertyValue('--w-open')) || lw;
        const openness = open > idle ? Math.min(Math.max((lw - idle) / (open - idle), 0), 1) : 0;

        if (fadeAt) fade = Math.min((now - fadeAt) / FADE_MS, 1);

        // Pass 3: the optics, into the pill's rect of the same canvas. Scissor
        // as well as viewport, because the shader samples outside the pill and
        // the viewport alone would not stop it writing there.
        const px = Math.round(vx * dpr), py = Math.round(CH - (vy + h) * dpr);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(px, py, W, H);
        gl.enable(gl.SCISSOR_TEST);
        gl.scissor(px, py, W, H);
        gl.enable(gl.BLEND);
        gl.useProgram(lensProg.p);
        gl.uniform1i(lensU.uTex, 0);
        gl.uniform2f(lensU.uOffset, px, py);
        gl.uniform2f(lensU.uCanvas, W, H);
        gl.uniform2f(lensU.uScale, scaleX, scaleY);
        gl.uniform2f(lensU.uHalf, (lw / 2) * dpr, (lh / 2) * dpr);
        gl.uniform1f(lensU.uRadius, Math.min(lw, lh) / 2 * dpr);
        gl.uniform1f(lensU.uThick, THICK * dpr);
        gl.uniform1f(lensU.uDisp, DISP * dpr);
        gl.uniform1f(lensU.uIOR, IOR);
        gl.uniform1f(lensU.uPeak, peakBend);
        gl.uniform1f(lensU.uLod, Math.log2(6.5 - 4.6 * openness));
        // Light drifts with the pull, so the highlight slides as the pill moves.
        // Screen y is down and GL y is up, hence the flip.
        gl.uniform2f(lensU.uLight, -0.35 - tx / 90, 0.75 + ty / 90);
        gl.uniform1f(lensU.uSpec, 0.22);
        gl.uniform1f(lensU.uFres, 0.09);
        gl.uniform1f(lensU.uFade, fade);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        gl.disable(gl.SCISSOR_TEST);
        gl.disable(gl.BLEND);
        return true;
      }

      // --- mochi: pull the pill, it stretches toward you and springs home ----
      const spring = { x: 0, y: 0, vx: 0, vy: 0 };
      let dragging = false, pointerId = null, grabX = 0, grabY = 0, travel = 0, pressedAt = 0;
      let press = 0;          // 0 released, 1 held — eased so a tap still reads
      const PULL = 46;        // px at which the rubber band is fully stretched
      const STIFF = 0.16, DAMP = 0.74;
      // The two dials worth touching. A diagonal pull splits across both axes,
      // so heavy SQUASH makes 45 degrees cancel itself out and the pill pulses
      // as you circle it; keeping it well under STRETCH evens the sweep out.
      const STRETCH = 14;     // px the pulled axis grows by at full stretch
      const SQUASH = 5;       // px the other axis gives back
      const PRESS = 2;        // px the whole pill shrinks by while held

      // Deformation is budgeted in pixels, not as a ratio. A ratio makes the
      // 560px command bar move four times as far as the 150px button for the
      // same drag — which is what felt scaled — and it keeps the two axes
      // wildly unequal on a shape this wide, so a circular drag pulsed instead
      // of running smoothly. Pixels are the same everywhere, and resolving the
      // pull onto the pill's own axes means no shear at any angle.
      // Kept for the lens, which now measures the pill after the transform and
      // has to divide the stretch back out to solve the optics undeformed.
      let scaleX = 1, scaleY = 1;

      function applyTransform() {
        const { x, y } = spring;
        const W = button.offsetWidth || 1, H = button.offsetHeight || 1;
        const ax = Math.min(Math.abs(x) / PULL, 1);
        const ay = Math.min(Math.abs(y) / PULL, 1);
        const held = press * PRESS;
        const ex = STRETCH * ax - SQUASH * ay - held;
        const ey = STRETCH * ay - SQUASH * ax - held;
        scaleX = (W + ex) / W;
        scaleY = (H + ey) / H;
        button.style.setProperty('--tx', x.toFixed(2) + 'px');
        button.style.setProperty('--ty', y.toFixed(2) + 'px');
        button.style.setProperty('--sx', scaleX.toFixed(4));
        button.style.setProperty('--sy', scaleY.toFixed(4));
      }

      // Neither of the obvious clocks survives Gecko: requestVideoFrameCallback
      // fires ~24 times a second against a 60fps source and currentTime only
      // admits to ~24 of the ~55 frames drawImage will actually hand over. Both
      // throttle the signal, not the frames, so gating on either played the
      // backdrop at 24fps. The wall clock does not lie; the source rate is the
      // only thing worth pacing against.
      const FRAME_MS = 1000 / 61;   // just under 60fps, so a 60Hz source never slips a beat
      let lastBlit = -1e9;

      function videoPlaying() {
        return !!(video && !reduced.matches && !video.paused && !video.ended &&
                  video.readyState >= 2 && video.videoWidth);
      }

      let rafId = 0, settled = true, dirty = false;
      function tick(now) {
        rafId = 0;
        if (!dragging) {
          spring.vx = (spring.vx - spring.x * STIFF) * DAMP;
          spring.vy = (spring.vy - spring.y * STIFF) * DAMP;
          spring.x += spring.vx;
          spring.y += spring.vy;
          if (Math.hypot(spring.x, spring.y) < 0.05 && Math.hypot(spring.vx, spring.vy) < 0.05) {
            spring.x = spring.y = spring.vx = spring.vy = 0;
            settled = true;
          }
        }
        press += ((dragging ? 1 : 0) - press) * 0.25;
        applyTransform();

        const moving = dragging || !settled || press > 0.001;
        const playing = videoPlaying();
        const newFrame = playing && (now - lastBlit) >= FRAME_MS;
        if (newFrame) lastBlit = now;
        // `dirty` covers the redraws nothing else asks for: the pill changed
        // size but is not moving and the video is not feeding frames, which is
        // exactly the reduced-motion path on a poster backdrop.
        if (gl && (moving || newFrame || dirty || fade < 1)) {
          // `dirty` means something changed that the clock cannot see — a seek,
          // a resize — so the frame in the texture is no longer trustworthy.
          // Re-uploading off the beat is safe now that one texture feeds both
          // passes: there is no second copy left for it to drift against.
          if (newFrame || dirty || !srcKind) upload();
          // The canvas only takes over from the <video> once it has something
          // to show, so a failed or not-yet-ready source leaves both alone.
          if (drawStage(spring.x, spring.y, now)) {
            document.body.classList.add('lensing');
          }
          dirty = false;
        }
        watchFrameRate(now);
        // Keep the loop alive while the video is running; a still page with a
        // settled spring and no playback schedules nothing.
        if (!lensOff && (moving || playing || fade < 1)) schedule();
      }

      // Software GL renders this at roughly 16fps. Sample the cadence once the
      // page has settled and hand the whole effect back to CSS if it cannot
      // hold up. The bar is deliberately far below 30Hz displays, which are
      // legitimately slow and must not trip it.
      let watchPrev = 0, watchCount = 0, watchSum = 0, watchDone = false;
      const WATCH_SKIP = 20, WATCH_TAKE = 50, WATCH_LIMIT = 45;

      function watchFrameRate(now) {
        if (watchDone || lensOff || !button.classList.contains('has-lens')) return;
        if (document.hidden) { watchPrev = 0; watchCount = 0; watchSum = 0; return; }
        if (watchPrev) {
          const dt = now - watchPrev;
          if (++watchCount > WATCH_SKIP) watchSum += dt;
          if (watchCount >= WATCH_SKIP + WATCH_TAKE) {
            watchDone = true;
            if (watchSum / WATCH_TAKE > WATCH_LIMIT) disableLens();
          }
        }
        watchPrev = now;
      }

      function schedule() {
        if (!rafId) rafId = requestAnimationFrame(tick);
      }

      // The pill's box changed without the spring running: redraw once.
      function invalidate() {
        dirty = true;
        schedule();
      }

      // Rubber band: linear near the origin, asymptotic past PULL.
      const band = (d) => PULL * Math.tanh(d / PULL);

      button.addEventListener('pointerdown', (event) => {
        if (event.button !== undefined && event.button !== 0) return;
        grabX = event.clientX; grabY = event.clientY;
        travel = 0; pressedAt = performance.now();
        // Reduced motion still tracks the press, so a drag never copies —
        // it just doesn't animate the pill.
        if (reduced.matches) return;
        dragging = true; settled = false;
        pointerId = event.pointerId;
        if (button.setPointerCapture) button.setPointerCapture(pointerId);
        schedule();
      });

      button.addEventListener('pointermove', (event) => {
        if (!pressedAt) return;
        const dx = event.clientX - grabX, dy = event.clientY - grabY;
        const d = Math.hypot(dx, dy);
        travel = Math.max(travel, d);
        if (!dragging || event.pointerId !== pointerId) return;
        if (d > 0) {
          const pulled = band(d);
          spring.x = (dx / d) * pulled;
          spring.y = (dy / d) * pulled;
        }
        if (travel > 6) button.classList.add('is-dragging');
        schedule();
      });

      function release(event) {
        if (!dragging || (event && event.pointerId !== pointerId)) return;
        dragging = false;
        button.classList.remove('is-dragging');
        // Let go mid-pull and it snaps back past centre before settling.
        spring.vx = -spring.x * 0.16;
        spring.vy = -spring.y * 0.16;
        if (button.releasePointerCapture && button.hasPointerCapture &&
            button.hasPointerCapture(pointerId)) {
          button.releasePointerCapture(pointerId);
        }
        schedule();
      }

      button.addEventListener('pointerup', release);
      button.addEventListener('pointercancel', release);

      // Consumed by the copy handler: anything past a few px, or a long hold,
      // was a drag, so the clipboard stays out of it. pressedAt of 0 means no
      // pointer sequence led here — a keyboard Enter or Space — which always
      // counts as a plain activation.
      function wasDragged() {
        const dragged = pressedAt !== 0 &&
          (travel > 6 || performance.now() - pressedAt > 700);
        travel = 0;
        pressedAt = 0;
        return dragged;
      }

      function enableLens() {
        if (lensOff || button.classList.contains('has-lens')) return;
        if (!gl && !initGL()) return;   // no WebGL2 — the CSS frost stands in
        if (!upload()) return;          // no frame yet, or a tainted one
        if (!drawStage(spring.x, spring.y, performance.now())) return;
        document.body.classList.add('lensing');
        button.classList.add('has-lens');
        fade = 0; fadeAt = performance.now();
        if (video) {
          video.addEventListener('play', schedule);
          video.addEventListener('seeked', invalidate);
        }
        schedule();
      }

      // Both, always. The canvas can come up on the poster before the video has
      // a frame, and it covers the video once it does — so if the loop were
      // allowed to idle there, a video that only became ready afterwards would
      // never get drawn and the page would sit on a frozen still. enableLens
      // returns early once the lens is on, so it cannot restart the loop itself.
      const wake = () => { enableLens(); invalidate(); };
      if (video) {
        video.addEventListener('loadeddata', wake);
        video.addEventListener('canplay', wake);
        video.addEventListener('playing', wake);
      }
      poster.addEventListener('load', wake);
      enableLens();
      window.addEventListener('resize', () => { enableLens(); invalidate(); });
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) schedule();
      });
    })();
  </script>
</body>
</html>
